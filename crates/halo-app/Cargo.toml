[package]
name = "halo-app"
description = "Halo: one thread for everything, summoned with left ⌘ from anywhere"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "halo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
halo-core.workspace = true
cc-agent.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
dirs.workspace = true
log.workspace = true
env_logger = "0.11"
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
base64 = "0.22"
voice-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
