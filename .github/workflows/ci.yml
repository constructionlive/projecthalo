# Every push and pull request: formatting, lints, the engine's tests, the UI's
# types and build, on macOS (the speech engine's ScreenCaptureKit glue needs a
# current SDK, so the newest runner) and Windows, which also builds the
# installer and keeps it as the run's artifact.
name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI dependencies
        run: cd ui && npm ci
      - name: Theme kit
        run: node scripts/stage-kit.mjs
      - name: UI types and build (the app embeds it)
        run: cd ui && npx tsc --noEmit -p . && npx vite build
      - name: Format
        run: cargo fmt --all --check
      # Failures are repeated as annotations, so they show on the pull request.
      - name: Lints
        run: |
          cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.log; status=${PIPESTATUS[0]}
          [ "$status" = 0 ] || { grep -E "(error|warning)(\[|:)" clippy.log | head -20 | sed 's/^/::error::/'; exit 1; }
      - name: Engine tests
        run: |
          cargo test --no-fail-fast -p halo-core -p cc-agent 2>&1 | tee test.log; status=${PIPESTATUS[0]}
          [ "$status" = 0 ] || { echo "::error::$( (grep -E -A3 "panicked|FAILED|error(\[|:)" test.log || tail -40 test.log) | head -60 | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; }

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI dependencies
        run: cd ui && npm ci
      - name: Theme kit
        run: node scripts/stage-kit.mjs
      - name: UI build (the app embeds it)
        run: cd ui && npx vite build
      - name: Lints
        run: |
          set +eo pipefail # (shell: bash stops at the first failure; the report below must still run)
          cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.log; status=${PIPESTATUS[0]}
          [ "$status" = 0 ] || { grep -E "(error|warning)(\[|:)" clippy.log | head -20 | sed 's/^/::error::/'; exit 1; }
      - name: Installer
        run: |
          cargo install tauri-cli --version "^2" --locked
          cd crates/halo-app && cargo tauri build
      - uses: actions/upload-artifact@v5
        with:
          name: halo-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Engine tests
        run: |
          set +eo pipefail
          cargo test --no-fail-fast -p halo-core -p cc-agent 2>&1 | tee test.log; status=${PIPESTATUS[0]}
          [ "$status" = 0 ] || { echo "::error::$( (grep -E -A3 "panicked|FAILED|error(\[|:)" test.log || tail -40 test.log) | head -60 | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; }
