# Every push and pull request: formatting, lints, the engine's tests, the UI's
# types and build. macOS, where Halo runs today.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI dependencies
        run: cd ui && npm ci
      - name: Theme kit
        run: scripts/stage-kit.sh
      - name: UI types and build (the app embeds it)
        run: cd ui && npx tsc --noEmit -p . && npx vite build
      - name: Format
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Engine tests
        run: cargo test -p halo-core -p cc-agent
