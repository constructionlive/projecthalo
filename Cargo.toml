[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
dirs = "6"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
cc-agent = { path = "crates/cc-agent" }
halo-core = { path = "crates/halo-core" }
# The speech engine (from LiveType): dictation and transcription, on this machine.
voice-core = { path = "crates/voice-core" }
